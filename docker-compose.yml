services:
  postgres:
    image: postgres:16-alpine
    container_name: parfume-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: parfume
      POSTGRES_PASSWORD: parfume_secret
      POSTGRES_DB: parfume_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
